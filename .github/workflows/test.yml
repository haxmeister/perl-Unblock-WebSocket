name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            perl: '5.16'
            distribution: default
          - os: ubuntu-latest
            perl: 'latest'
            distribution: default
          - os: macos-latest
            perl: 'latest'
            distribution: default
          - os: windows-latest
            perl: '5.40'
            distribution: strawberry

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ matrix.distribution }}

      - name: Install dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cpanm --notest Uniform::HTTP@0.05 URI
          cpanm --notest --installdeps .

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cpanm --notest Uniform::HTTP@0.05
          cpanm --notest --installdeps .

      - name: Build and test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          perl Makefile.PL
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" test

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          perl Makefile.PL
          perl -MConfig -e 'system($Config{make}, "test"); exit($? >> 8)'

      - name: Test optional HTTP1 and HTTP2 handoffs
        if: matrix.os == 'ubuntu-latest' && matrix.perl == 'latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libnghttp2-dev pkg-config
          cpanm --notest Unblock::HTTP1 Unblock::HTTP2
          prove -b t/35-http1-handoff.t t/36-http2-handoff.t

      - name: Exercise HTTP3 QUIC handoff
        if: matrix.os == 'ubuntu-latest' && matrix.perl == 'latest'
        shell: bash
        run: |
          cpanm --notest Alien::nghttp3@0.01 Uniform::HTTP@0.06 Net::QUIC@0.04 Test2::V0
          git clone --depth 1 https://github.com/haxmeister/perl-Unblock-HTTP3.git /tmp/unblock-http3-current
          cpanm --notest /tmp/unblock-http3-current
          OPENSSL_CONF=/etc/ssl/openssl.cnf openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/unblock-ws-h3-key.pem \
            -out /tmp/unblock-ws-h3-cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'
          UNBLOCK_WS_H3_CERT=/tmp/unblock-ws-h3-cert.pem \
          UNBLOCK_WS_H3_KEY=/tmp/unblock-ws-h3-key.pem \
            prove -b xt/http3-handoff.t

      - name: Benchmark manual and attached output
        if: matrix.os == 'ubuntu-latest' && matrix.perl == 'latest'
        shell: bash
        run: |
          perl -Mblib bench/attached-path.pl 5000

      - name: Smoke example programs
        if: matrix.os == 'ubuntu-latest' && matrix.perl == 'latest'
        shell: bash
        run: |
          perl -Mblib examples/memory-attached.pl
          perl -Mblib examples/memory-manual.pl

      - name: Check POD syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if grep -q '^=' "$file"; then
              podchecker "$file"
            fi
          done < <(find lib -name '*.pm' -print0)

      - name: Check distribution manifest
        if: matrix.os == 'ubuntu-latest' && matrix.perl == 'latest'
        shell: bash
        run: |
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" distcheck

      - name: Test distribution tree
        if: matrix.os == 'ubuntu-latest' && matrix.perl == 'latest'
        shell: bash
        run: |
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" disttest

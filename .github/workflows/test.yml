name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            perl: '5.16'
            distribution: default
          - os: ubuntu-latest
            perl: 'latest'
            distribution: default
          - os: macos-latest
            perl: 'latest'
            distribution: default
          - os: windows-latest
            perl: '5.40'
            distribution: strawberry

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ matrix.distribution }}

      - name: Install dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cpanm --notest Uniform::HTTP@0.05 URI
          cpanm --notest --installdeps .

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cpanm --notest Uniform::HTTP@0.05
          cpanm --notest --installdeps .

      - name: Build and test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          perl Makefile.PL
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" test

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          perl Makefile.PL
          perl -MConfig -e 'system($Config{make}, "test"); exit($? >> 8)'

      - name: Check POD syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if grep -q '^=' "$file"; then
              podchecker "$file"
            fi
          done < <(find lib -name '*.pm' -print0)

      - name: Check distribution manifest
        if: matrix.os == 'ubuntu-latest' && matrix.perl == 'latest'
        shell: bash
        run: |
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" distcheck

      - name: Test distribution tree
        if: matrix.os == 'ubuntu-latest' && matrix.perl == 'latest'
        shell: bash
        run: |
          MAKE=$(perl -MConfig -e 'print $Config{make}')
          "$MAKE" disttest
